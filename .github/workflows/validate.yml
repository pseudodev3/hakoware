name: Validate Hakoware

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Audit frontend dependencies
        run: npm audit --audit-level=high

      - name: Reject tracked env files
        run: |
          bad_env="$(git ls-files | grep -E '(^|/)\.env($|\.)' | grep -vE '(^|/)\.env\.example$' || true)"
          if [ -n "$bad_env" ]; then
            echo "Tracked environment file(s) found:"
            echo "$bad_env"
            exit 1
          fi

      - name: Scan obvious committed secret patterns
        run: |
          if git grep -I -nE 'mongodb(\+srv)?://[^[:space:]]+:[^@[:space:]]+@|xkeysib-[A-Za-z0-9_-]{20,}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----' -- .; then
            echo "Potential committed secret detected."
            exit 1
          fi

      - name: Build frontend
        run: npm run build

      - name: Check crawlable public pages and indexing boundaries
        run: npm run check:seo

      - name: Check circle activity acknowledgement
        run: npm run check:circle-activity

      - name: Check activation and return guidance
        run: npm run check:next-move

      - name: Check durable bank retry recovery
        run: npm run check:bank-retry

      - name: Check hosted checkout link boundaries and displayed prices
        run: npm run check:checkout-links

      - name: Check Circle filters, bundle comparisons and Sparks availability
        run: npm run check:ui-polish

      - name: Check account switching and late private responses
        run: npm run check:session-boundaries

      - name: Check deciding duel feedback
        run: npm run check:duel-feedback

      - name: Install backend dependencies
        working-directory: server
        run: npm ci --no-audit --no-fund

      - name: Audit backend production dependencies
        working-directory: server
        run: npm audit --omit=dev --audit-level=high

      - name: Check backend syntax
        working-directory: server
        run: |
          node --check index.js
          find routes services middleware models -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Check client payload minimization
        working-directory: server
        run: npm run check:client-payloads

      - name: Check request guards and allowed origins
        working-directory: server
        run: npm run check:server-hardening

      - name: Check reset-token races, bounded queries and privacy
        working-directory: server
        run: npm run check:security-scaling

      - name: Check first mutual check-in
        working-directory: server
        run: npm run check:duo-activation

      - name: Check friend spaces and progression boundaries
        working-directory: server
        run: npm run check:friend-spaces

      - name: Check Poke retirement and historical compatibility
        working-directory: server
        run: npm run check:poke-retirement

      - name: Check friend duels, hidden hands and concurrent turns on standalone MongoDB
        working-directory: server
        run: npm run check:duels

      - name: Check retired browsing, mutual chat, moderation and casual duels
        working-directory: server
        run: npm run check:people

      - name: Check voluntary open tables, cancellation, recovery and pairing races
        working-directory: server
        run: npm run check:open-tables

      - name: Check private Sparks, photos, reactions and reply recovery
        working-directory: server
        run: npm run check:sparks

      - name: Check Sparks on existing database indexes
        working-directory: server
        run: npm run check:sparks-legacy-indexes

      - name: Check Sparks recovery after database storage pressure
        working-directory: server
        run: npm run check:sparks-storage-recovery

      - name: Check Aura bank integrity and repayment
        working-directory: server
        run: npm run check:aura-bank

      - name: Check earned Duo credit without a bank visit
        working-directory: server
        run: npm run check:earned-duo-credit

      - name: Check public world activity and Flare delivery
        working-directory: server
        run: npm run check:world-activity

      - name: Check Flare delivery on trial database storage
        working-directory: server
        run: npm run check:flare-trial-delivery

      - name: Check Duo identity and earned profile customization
        working-directory: server
        run: npm run check:presentation

      - name: Check cosmetic previews, private saved collections and ownership gates
        working-directory: server
        run: npm run check:cosmetics

      - name: Check verified Stripe cosmetics and gifting with blocked indexes
        working-directory: server
        run: npm run check:cosmetic-checkout

      - name: Check NOWPayments confirmation, invoice recovery and gifting with blocked indexes
        working-directory: server
        run: npm run check:nowpayments-checkout

      - name: Check private product journeys and real return cohorts
        working-directory: server
        run: npm run check:product-journeys

      - name: Check After Hours conversations and next-day returns
        working-directory: server
        run: npm run check:after-hours-social

      - name: Check card trades and wall retirement
        working-directory: server
        run: npm run check:cards-wall

      - name: Check card exchange on standalone MongoDB with blocked indexes
        working-directory: server
        run: npm run check:standalone-trades

      - name: Check card purchases on standalone MongoDB
        working-directory: server
        run: npm run check:card-purchases
