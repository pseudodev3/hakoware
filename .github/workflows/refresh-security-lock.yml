name: Refresh backend security lock

on:
  push:
    branches:
      - security/prelaunch-hardening

permissions:
  contents: write

jobs:
  refresh-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/prelaunch-hardening
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Regenerate patched backend lockfile
        working-directory: server
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm audit fix --package-lock-only --ignore-scripts --no-fund
      - name: Commit lockfile if changed
        run: |
          if git diff --quiet -- server/package-lock.json; then
            echo "Lockfile already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/package-lock.json
          git commit -m "Regenerate patched backend lockfile"
          git push origin HEAD:security/prelaunch-hardening
